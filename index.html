<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventura JS</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; padding: 0; background: #f4f4f9; color: #333; }
        h2 { text-align: center; }
        .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        button.delete { background: #dc3545; }
        button.download { background: #28a745; }
        button.drive { background: #ff5722; color: white; margin-top: 15px; }
        button.server-file { background: #17a2b8; color: white; margin-top: 8px; }
        button.edit { background: #ffc107; color: #212529; padding: 6px 10px; font-size: 14px; width: auto; margin-top: 0; }
        input { width: 94%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; background: #000; }
        #statusKamere { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; margin-top: 10px; font-size: 14px; border: 1px solid #ffeeba; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>

    <h2>📦 Mobilna Gio#Djokosavic Inventura 2026</h2>

    <!-- Kamera Skener -->
    <div class="box">
        <h3>1. Skeniranje / Unos</h3>
        <div id="statusKamere"></div>
        <div id="reader" style="display: none;"></div>
        <button id="btnKamera" onclick="pokreniKameru()">📷 Upali kameru za Bar-kod</button>
        
        <p>
            <label>Bar-kod ili Šifra:</label>
            <input type="text" id="sifra" placeholder="Skenirajte ili upišite ručno">
        </p>
        <p>
            <label>Količina:</label>
            <input type="number" id="kolicina" value="1" min="1">
        </p>
        <button onclick="dodajArtikal()">➕ Upiši Artikal</button>
    </div>

    <!-- Lista artikala u memoriji -->
    <div class="box">
        <h3>2. Zadržani artikli na telefonu</h3>
        <button class="download" onclick="preuzmiCSV()">💾 Preuzmi lokalno na telefon (TXT)</button>
        <button class="delete" onclick="obrisiSve()">🗑️ Obriši sve sa telefona</button>
        
        <!-- Slanje direktno na C:\SERVER\inventura.txt -->
        <button class="drive" onclick="posaljiNaServer()">🚀 Pošalji inventuru na C:\SERVER</button>
        <button class="server-file" onclick="otvoriSaServera()">📂 Otvori / Preuzmi inventura.txt sa servera</button>
        
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Šifra / Bar-kod</th>
                        <th>Količina</th>
                        <th>Akcija</th>
                    </tr>
                </thead>
                <tbody id="tabelaArtikala">
                </tbody>
            </table>
        </div>
    </div>

<script>
    const SERVER_URL = "http://10.53.98.10:3000";
    let artikli = JSON.parse(localStorage.getItem("inventura_artikli")) || [];
    prikaziArtikale();

    let html5Qrcode = null;
    let mozeSkenirati = true;

    function prikaziStatus(poruka, jeGreska = true) {
        const statusDiv = document.getElementById("statusKamere");
        statusDiv.style.display = "block";
        statusDiv.style.background = jeGreska ? "#f8d7da" : "#d4edda";
        statusDiv.style.color = jeGreska ? "#721c24" : "#155724";
        statusDiv.style.borderColor = jeGreska ? "#f5c6cb" : "#c3e6cb";
        statusDiv.innerHTML = poruka;
    }

    function pokreniKameru() {
        const readerDiv = document.getElementById("reader");
        const btnKamera = document.getElementById("btnKamera");

        // 1. Provjera da li je sajt na HTTPS ili localhost
        if (!window.isSecureContext) {
            prikaziStatus("<b>BLOKIRANO OD STRANE TELEFONA:</b> Otvarate sajt preko nezaštićene veze (<b>" + window.location.protocol + "</b>). Telefon dozvoljava kameru SAMO preko <b>https://</b> adrese!");
            return;
        }

        // 2. Provjera da li pregledač uopšte podržava kameru
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            prikaziStatus("<b>GREŠKA PREGLEDAČA:</b> Vaš pregledač ne podržava pristup kameri. Otvorite stranicu u <b>Google Chrome</b> aplikaciji.");
            return;
        }

        // 3. Provjera da li je skripta učitana
        if (typeof Html5Qrcode === "undefined") {
            prikaziStatus("<b>GREŠKA SA INTERNETOM:</b> Skripta za skener se nije učitala. Provjerite da li telefon ima internet.");
            return;
        }

        if (html5Qrcode && html5Qrcode.isScanning) {
            ugasiKameru();
            return;
        }

        prikaziStatus("Pokrećem kameru, molimo sačekajte i kliknite <b>Dozvoli (Allow)</b> ako vas telefon pita...", false);
        readerDiv.style.display = "block";
        btnKamera.innerText = "🛑 Ugasi kameru";
        btnKamera.style.background = "#6c757d";

        html5Qrcode = new Html5Qrcode("reader");
        
        html5Qrcode.start(
            { facingMode: "environment" }, 
            {
                fps: 10,
                qrbox: { width: 250, height: 150 }
            },
            (decodedText) => {
                if (!mozeSkenirati) return; 
                mozeSkenirati = false; 
                
                document.getElementById("sifra").value = decodedText;
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(100);
                }
                dodajArtikal();

                setTimeout(() => {
                    mozeSkenirati = true;
                }, 1500); 
            },
            (errorMessage) => {}
        ).then(() => {
            document.getElementById("statusKamere").style.display = "none";
        }).catch(err => {
            prikaziStatus("<b>GREŠKA KAMERE:</b> " + err);
            ugasiKameru();
        });
    }

    function ugasiKameru() {
        const readerDiv = document.getElementById("reader");
        const btnKamera = document.getElementById("btnKamera");
        
        if (html5Qrcode) {
            html5Qrcode.stop().then(() => {
                html5Qrcode.clear();
                readerDiv.style.display = "none";
                btnKamera.innerText = "📷 Upali kameru za Bar-kod";
                btnKamera.style.background = "#007bff";
            }).catch(err => {
                readerDiv.style.display = "none";
                btnKamera.innerText = "📷 Upali kameru za Bar-kod";
                btnKamera.style.background = "#007bff";
            });
        }
    }

    function dodajArtikal() {
        let sifra = document.getElementById("sifra").value.trim();
        let kolicina = parseInt(document.getElementById("kolicina").value);

        if (!sifra || isNaN(kolicina) || kolicina < 1) return; 

        let postojeci = artikli.find(a => a.sifra === sifra);
        if (postojeci) {
            postojeci.kolicina += kolicina;
        } else {
            artikli.push({ sifra: sifra, kolicina: kolicina });
        }

        localStorage.setItem("inventura_artikli", JSON.stringify(artikli));
        prikaziArtikale();

        document.getElementById("sifra").value = "";
        document.getElementById("kolicina").value = "1";
    }

    function izmjeniKolicinu(sifraArtikla) {
        let artikal = artikli.find(a => a.sifra === sifraArtikla);
        if (artikal) {
            let novaKolicina = prompt(`Unesite novu količinu za artikal ${sifraArtikla}:`, artikal.kolicina);
            if (novaKolicina === null) return; 
            
            let uneseniBroj = parseInt(novaKolicina);
            if (isNaN(uneseniBroj) || uneseniBroj < 0) {
                alert("Molimo unesite ispravan broj (0 ili veći).");
                return;
            }

            if (uneseniBroj === 0) {
                if (confirm("Količina je 0. Želite li ukloniti ovaj artikal iz inventure?")) {
                    artikli = artikli.filter(a => a.sifra !== sifraArtikla);
                } else {
                    return;
                }
            } else {
                artikal.kolicina = uneseniBroj;
            }

            localStorage.setItem("inventura_artikli", JSON.stringify(artikli));
            prikaziArtikale();
        }
    }

    function prikaziArtikale() {
        let tbody = document.getElementById("tabelaArtikala");
        tbody.innerHTML = "";
        
        artikli.forEach(artikal => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${artikal.sifra}</td>
                <td>${artikal.kolicina}</td>
                <td><button class="edit" onclick="izmjeniKolicinu('${artikal.sifra}')">✏️ Izmjeni</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function generisiTekstInventure() {
        if (artikli.length === 0) return "";
        let tekst = "";
        artikli.forEach(artikal => {
            tekst += `${artikal.sifra};${artikal.kolicina}\r\n`;
        });
        return tekst;
    }

    function preuzmiCSV() {
        let tekst = generisiTekstInventure();
        if (!tekst) {
            alert("Lista je prazna!");
            return;
        }
        const blob = new Blob([tekst], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
