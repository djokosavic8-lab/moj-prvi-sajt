<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventura JS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; padding: 0; background: #f4f4f9; color: #333; }
        h2 { text-align: center; }
        .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        button.delete { background: #dc3545; }
        button.download { background: #28a745; }
        button.drive { background: #ff5722; color: white; margin-top: 15px; }
        button.edit { background: #ffc107; color: #212529; padding: 6px 10px; font-size: 14px; width: auto; margin-top: 0; }
        input { width: 94%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; background: #eee; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>

    <h2>📦 Mobilna Sav Djokina Inventura 2026</h2>

    <!-- Kamera Skener -->
    <div class="box">
        <h3>1. Skeniranje / Unos</h3>
        <div id="reader" style="display: none; min-height: 250px;"></div>
        <button id="btnKamera" onclick="pokreniKameru()">📷 Upali kameru za Bar-kod</button>
        
        <p>
            <label>Bar-kod ili Šifra:</label>
            <input type="text" id="sifra" placeholder="Skenirajte ili upišite ručno">
        </p>
        <p>
            <label>Količina:</label>
            <input type="number" id="kolicina" value="1" min="1">
        </p>
        <button onclick="dodajArtikal()">➕ Upiši Artikal</button>
    </div>

    <!-- Lista artikala u memoriji -->
    <div class="box">
        <h3>2. Zadržani artikli na telefonu</h3>
        <button class="download" onclick="preuzmiCSV()">💾 Preuzmi lokalno na telefon (TXT)</button>
        <button class="delete" onclick="obrisiSve()">🗑️ Obriši sve sa telefona</button>
        
        <!-- Ovdje je ubačeno dugme i skrivena forma za slanje na Google Drive -->
        <form id="driveForma" action="https://formspree.io" method="POST" style="display:none;">
            <textarea name="Sadržaj Inventure" id="formaSadrzaj"></textarea>
            <input type="text" name="_subject" value="Nova Inventura 2026">
        </form>
        <button class="drive" onclick="posaljiNaGoogleDrive()">🚀 Pošalji inventuru direktno na Google Drive</button>
        
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Šifra / Bar-kod</th>
                        <th>Količina</th>
                        <th>Akcija</th>
                    </tr>
                </thead>
                <tbody id="tabelaArtikala">
                    <!-- JS ubacuje redove -->
                </tbody>
            </table>
        </div>
    </div>

<script>
    let artikli = JSON.parse(localStorage.getItem("inventura_artikli")) || [];
    prikaziArtikale();

    let html5Qrcode = null;
    let mozeSkenirati = true;

    function pokreniKameru() {
        const readerDiv = document.getElementById("reader");
        const btnKamera = document.getElementById("btnKamera");

        if (html5Qrcode && html5Qrcode.isScanning) {
            ugasiKameru();
            return;
        }

        readerDiv.style.display = "block";
        btnKamera.innerText = "🛑 Ugasi kameru";
        btnKamera.style.background = "#6c757d";

        html5Qrcode = new Html5Qrcode("reader");
        
        html5Qrcode.start(
            { facingMode: "environment" }, 
            {
                fps: 10,
                qrbox: function(width, height) {
                    return { width: width * 0.7, height: height * 0.5 };
                }
            },
            (decodedText) => {
                if (!mozeSkenirati) return; 
                mozeSkenirati = false; 
                
                document.getElementById("sifra").value = decodedText;
                
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(100);
                }
                
                dodajArtikal();

                setTimeout(() => {
                    mozeSkenirati = true;
                }, 1500); 
            },
            (errorMessage) => {}
        ).catch(err => {
            alert("Greška pri pokretanju kamere: " + err);
            ugasiKameru();
        });
    }

    function ugasiKameru() {
        const readerDiv = document.getElementById("reader");
        const btnKamera = document.getElementById("btnKamera");
        
        if (html5Qrcode) {
            html5Qrcode.stop().then(() => {
                html5Qrcode.clear();
                readerDiv.style.display = "none";
                btnKamera.innerText = "📷 Upali kameru za Bar-kod";
                btnKamera.style.background = "#007bff";
            }).catch(err => {
                readerDiv.style.display = "none";
                btnKamera.innerText = "📷 Upali kameru za Bar-kod";
                btnKamera.style.background = "#007bff";
            });
        }
    }

    function dodajArtikal() {
        let sifra = document.getElementById("sifra").value.trim();
        let kolicina = parseInt(document.getElementById("kolicina").value);

        if (!sifra || kolicina < 1) return; 

        let postojeci = artikli.find(a => a.sifra === sifra);
        if (postojeci) {
            postojeci.kolicina += kolicina;
        } else {
            artikli.push({ sifra: sifra, kolicina: kolicina });
        }

        localStorage.setItem("inventura_artikli", JSON.stringify(artikli));
        prikaziArtikale();

        document.getElementById("sifra").value = "";
        document.getElementById("kolicina").value = "1";
    }

    function izmjeniKolicinu(sifraArtikla) {
        let artikal = artikli.find(a => a.sifra === sifraArtikla);
        if (artikal) {
            let novaKolicina = prompt(`Unesite novu količinu za artikal ${sifraArtikla}:`, artikal.kolicina);
            if (novaKolicina === null) return; 
            
            let uneseniBroj = parseInt(novaKolicina);
            if (isNaN(uneseniBroj) || uneseniBroj < 0) {
                alert("Molimo unesite ispravan broj (0 ili veći).");
                return;
            }

            if (uneseniBroj === 0) {
                if (confirm("Količina je 0. Želite li ukloniti ovaj artikal iz inventure?")) {
                    artikli = artikli.filter(a => a.sifra !== sifraArtikla);
                } else {
                    return;
                }
            } else {
                artikal.kolicina = uneseniBroj;
            }

            localStorage.setItem("inventura_artikli", JSON.stringify(artikli));
            prikaziArtikale();
        }
    }

    // POPRAVLJENO I ZAVRŠENO: Generisanje tabele na ekranu
    function prikaziArtikale() {
        let tbody = document.getElementById("tabelaArtikala");
        tbody.innerHTML = "";
        
        artikli.forEach(artikal => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${artikal.sifra}</td>
                <td>${artikal.kolicina}</td>
                <td><button class="edit" onclick="izmjeniKolicinu('${artikal.sifra}')">✏️ Izmjeni</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Funkcija koja pretvara podatke iz memorije u tekstualni format za fajl
    function generisiTekstInventure() {
        if (artikli.length === 0) return "";
        let tekst = "Šifra/Bar-kod, Količina\n";
        artikli.forEach(a => {
            tekst += `${a.sifra}, ${a.kolicina}\n`;
        });
        return tekst;
    }

    // Lokalno preuzimanje TXT fajla na telefon
    function preuzmiCSV() {
        let sadrzaj = generisiTekstInventure();
        if (!sadrzaj) { alert("Nema artikala za preuzimanje."); return; }
        
        let blob = new Blob([sadrzaj], { type: "text/plain;charset=utf-8" });
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "inventura.txt";
        link.click();
        URL.revokeObjectURL(link.href);
    }

    function obrisiSve() {
        if (confirm("Da li ste sigurni da želite obrisati sve skenirane artikle sa telefona?")) {
            artikli = [];
            localStorage.removeItem("inventura_artikli");
            prikaziArtikale();
        }
    }

    // NOVA FUNKCIJA: Slanje sakupljenog teksta direktno prema Formspree -> Google Drive
    function posaljiNaGoogleDrive() {
        let sadrzaj = generisiTekstInventure();
        if (!sadrzaj) {
            alert("Nema artikala u listi. Prvo skenirajte nešto!");
            return;
        }

        // Ubacujemo tekst u skriveno polje forme
        document.getElementById("formaSadrzaj").value = sadrzaj;
        
        // Šaljemo formu servisu
        document.getElementById("driveForma").submit();
        alert("Podaci se šalju! Bićete preusmjereni na potvrdnu stranicu.");
    }
</script>
</body>
</html>
