<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventura JS</title>
    <!-- POPRAVLJENO: Učitan potpuno tačan i funkcionalan link za html5-qrcode biblioteku -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; padding: 0; background: #f4f4f9; color: #333; }
        h2 { text-align: center; }
        .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        button.delete { background: #dc3545; }
        button.download { background: #28a745; }
        input { width: 94%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; background: #eee; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f2f2f2; }
        .input-tabela { width: 70px; padding: 5px; font-size: 14px; text-align: center; }
        .btn-izbrisi { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>📦 Mobilna Djoke S Inventura 2026</h2>

    <!-- Kamera Skener -->
    <div class="box">
        <h3>1. Skeniranje / Unos</h3>
        <div id="reader" style="display: none; min-height: 250px;"></div>
        <button id="btnKamera" onclick="pokreniKameru()">📷 Upali kameru za Bar-kod</button>
        
        <p>
            <label>Bar-kod ili Šifra:</label>
            <input type="text" id="sifra" placeholder="Skenirajte ili upišite ručno">
        </p>
        <p>
            <label>Količina za dodavanje:</label>
            <input type="number" id="kolicina" value="1" min="1">
        </p>
        <button onclick="dodajArtikal()">➕ Upiši Artikal</button>
    </div>

    <!-- Lista artikala u memoriji -->
    <div class="box">
        <h3>2. Zadržani artikli na telefonu</h3>
        <button class="download" onclick="preuzmiCSV()">💾 Preuzmi inventura.txt</button>
        <button class="delete" onclick="obrisiSve()">🗑️ Obriši sve sa telefona</button>
        
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Šifra / Bar-kod</th>
                        <th>Količina (Uredi)</th>
                        <th>Akcija</th>
                    </tr>
                </thead>
                <tbody id="tabelaArtikala">
                    <!-- JS ubacuje redove -->
                </tbody>
            </table>
        </div>
    </div>

<script>
    // POPRAVLJENO: Ispravljena sintaksa za učitavanje lokalne memorije
    let artikli = JSON.parse(localStorage.getItem("inventura_artikli")) || [];
    prikaziArtikale();

    let html5Qrcode = null;
    let mozeSkenirati = true;

    function pokreniKameru() {
        const readerDiv = document.getElementById("reader");
        const btnKamera = document.getElementById("btnKamera");

        if (html5Qrcode && html5Qrcode.isScanning) {
            ugasiKameru();
            return;
        }

        readerDiv.style.display = "block";
        btnKamera.innerText = "🛑 Ugasi kameru";
        btnKamera.style.background = "#6c757d";

        html5Qrcode = new Html5Qrcode("reader");
        
        html5Qrcode.start(
            { facingMode: "environment" }, 
            {
                fps: 10,
                qrbox: function(width, height) {
                    return { width: width * 0.7, height: height * 0.5 };
                }
            },
            (decodedText) => {
                if (!mozeSkenirati) return; 
                mozeSkenirati = false; 
                
                document.getElementById("sifra").value = decodedText;
                
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(100);
                }
                
                // Automatski upisuje artikal bez gašenja kamere
                dodajArtikal();

                // Pauza od 1.5 sekunde da se stigne maknuti telefon sa koda prije sljedećeg skeniranja
                setTimeout(() => {
                    mozeSkenirati = true;
                }, 1500); 
            },
            (errorMessage) => {}
        ).catch(err => {
            alert("Greška pri pokretanju kamere: " + err);
            ugasiKameru();
        });
    }

    function ugasiKameru() {
        const readerDiv = document.getElementById("reader");
        const btnKamera = document.getElementById("btnKamera");
        
        if (html5Qrcode) {
            html5Qrcode.stop().then(() => {
                html5Qrcode.clear();
                readerDiv.style.display = "none";
                btnKamera.innerText = "📷 Upali kameru za Bar-kod";
                btnKamera.style.background = "#007bff";
            }).catch(err => {
                readerDiv.style.display = "none";
                btnKamera.innerText = "📷 Upali kameru za Bar-kod";
                btnKamera.style.background = "#007bff";
            });
        }
    }

    function dodajArtikal() {
        let sifra = document.getElementById("sifra").value.trim();
        let kolicina = parseInt(document.getElementById("kolicina").value);

        if (!sifra || kolicina < 1) return; 

        let postojeci = artikli.find(a => a.sifra === sifra);
        if (postojeci) {
            postojeci.kolicina += kolicina;
        } else {
            artikli.push({ sifra: sifra, kolicina: kolicina });
        }

        sacuvajUMemoriju();
        document.getElementById("sifra").value = "";
        document.getElementById("kolicina").value = "1";
    }

    // Omogućava promjenu količine direktno u tabeli
    function izmjeniKolicinu(sifra, novaKolicina) {
        let kolicina = parseInt(novaKolicina);
        if (isNaN(kolicina) || kolicina < 1) kolicina = 1;
        
        let artikal = artikli.find(a => a.sifra === sifra);
        if (artikal) {
            artikal.kolicina = kolicina;
            sacuvajUMemoriju(false); // Čuva u pozadini bez ponovnog iscrtavanja da ne gubi fokus sa tastature
        }
    }

    function obrisiArtikal(sifra) {
        artikli = artikli.filter(a => a.sifra !== sifra);
        sacuvajUMemoriju();
    }

    function sacuvajUMemoriju(osveziEkran = true) {
        localStorage.setItem("inventura_artikli", JSON.stringify(artikli));
        if (osveziEkran) prikaziArtikale();
    }

    function prikaziArtikale() {
        let tbody = document.getElementById("tabelaArtikala");
        tbody.innerHTML = "";
        artikli.forEach(artikal => {
            let row = `<tr>
                <td>${artikal.sifra}</td>
                <td><input type="number" class="input-tabela" value="${artikal.kolicina}" min="1" oninput="izmjeniKolicinu('${artikal.sifra}', this.value)"></td>
                <td><button class="btn-izbrisi" onclick="obrisiArtikal('${artikal.sifra}')">❌</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function preuzmiCSV() {
        if (artikli.length === 0) {
            alert("Nema podataka za preuzimanje!");
            return;
        }
        
        let csvContent = "";
        artikli.forEach(a => {
            csvContent += `${a.sifra},${a.kolicina}\n`;
        });

        let blob = new Blob([csvContent], { type: "text/plain;charset=utf-8" });
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "inventura.txt";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // POPRAVLJENO: Uklonjena blokirajuća sintaksna greška
    function obrisiSve() {
        if (confirm("Da li ste sigurni da želite obrisati sve skenirane artikle sa telefona?")) {
            localStorage.removeItem("inventura_artikli");
            artikli = [];
            prikaziArtikale();
        }
    }
</script>

</body>
</html>
