<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventura JS</title>
    <!-- Učitan provjeren i stabilan link za html5-qrcode biblioteku -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; padding: 0; background: #f4f4f9; color: #333; }
        h2 { text-align: center; }
        .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        button.delete { background: #dc3545; }
        button.download { background: #28a745; }
        input { width: 94%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; background: #eee; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f2f2f2; }
        /* Vizuelno obavještenje za uspješno automatsko skeniranje */
        .flash-success { animation: flash 0.3s ease-out; }
        @keyframes flash {
            0% { background: #28a745; }
            100% { background: white; }
        }
    </style>
</head>
<body>

    <h2>📦 Mobilna DjokinaS Inventura 2026</h2>

    <!-- Kamera Skener -->
    <div class="box" id="unosBox">
        <h3>1. Skeniranje / Unos</h3>
        <!-- Ovdje se prikazuje video stream sa kamere -->
        <div id="reader" style="display: none; min-height: 250px;"></div>
        <button id="btnKamera" onclick="pokreniKameru()">📷 Upali kameru za Bar-kod</button>
        
        <p>
            <label>Bar-kod ili Šifra:</label>
            <input type="text" id="sifra" placeholder="Skenirajte ili upišite ručno">
        </p>
        <p>
            <label>Količina:</label>
            <input type="number" id="kolicina" value="1" min="1">
        </p>
        <!-- POPRAVLJENO: Dodat parametar 'event' kako bismo blokirali refresh stranice -->
        <button type="button" onclick="dodajArtikal(event)">➕ Upiši Artikal</button>
    </div>

    <!-- Lista artikala u memoriji -->
    <div class="box">
        <h3>2. Zadržani artikli na telefonu</h3>
        <button class="download" onclick="preuzmiCSV()">💾 Preuzmi podatke za Računar (TXT)</button>
        <button class="delete" onclick="obrisiSve()">🗑️ Obriši sve sa telefona</button>
        
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Šifra / Bar-kod</th>
                        <th>Količina</th>
                    </tr>
                </thead>
                <tbody id="tabelaArtikala">
                    <!-- JS ubacuje redove -->
                </tbody>
            </table>
        </div>
    </div>

<script>
    let artikli = JSON.parse(localStorage.getItem("inventura_artikli")) || [];
    prikaziArtikale();

    let html5Qrcode = null;
    let zadnjiSkeniraniKod = "";
    let zadnjeVrijemeSkeniranja = 0;

    function pokreniKameru() {
        const readerDiv = document.getElementById("reader");
        const btnKamera = document.getElementById("btnKamera");

        if (html5Qrcode && html5Qrcode.isScanning) {
            ugasiKameru();
            return;
        }

        readerDiv.style.display = "block";
        btnKamera.innerText = "🛑 Ugasi kameru";
        btnKamera.style.background = "#6c757d";

        if (!html5Qrcode) {
            html5Qrcode = new Html5Qrcode("reader");
        }
        
        const config = {
            fps: 20, 
            qrbox: function(width, height) {
                return { width: Math.floor(width * 0.8), height: Math.floor(height * 0.4) };
            },
            experimentalFeatures: {
                useBarCodeDetectorIfSupported: true
            }
        };

        html5Qrcode.start(
            { facingMode: "environment" }, 
            config,
            (decodedText) => {
                let sada = Date.now();
                
                // Zaštita da ne skenira isti kod više puta u sekundi ako ruku držiš mirno
                if (decodedText === zadnjiSkeniraniKod && (sada - zadnjeVrijemeSkeniranja < 1500)) {
                    return; 
                }

                zadnjiSkeniraniKod = decodedText;
                zadnjeVrijemeSkeniranja = sada;

                document.getElementById("sifra").value = decodedText;
                
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(100);
                }
                
                // AUTOMATSKI UPIS: Odmah dodaj artikal i nastavi skenirati
                dodajArtikalAutomatski(decodedText);
            },
            (errorMessage) => {
                // Ignorišemo frejmove koji nemaju kod
            }
        ).catch(err => {
            alert("Greška sa kamerom! Detalji: " + err);
            ugasiKameru();
        });
    }

    function ugasiKameru() {
        const readerDiv = document.getElementById("reader");
        const btnKamera = document.getElementById("btnKamera");
        
        if (html5Qrcode && html5Qrcode.isScanning) {
            html5Qrcode.stop().then(() => {
                readerDiv.style.display = "none";
                btnKamera.innerText = "📷 Upali kameru za Bar-kod";
                btnKamera.style.background = "#007bff";
                zadnjiSkeniraniKod = ""; 
            }).catch(err => {
                console.error("Greška pri gašenju:", err);
                readerDiv.style.display = "none";
                btnKamera.innerText = "📷 Upali kameru za Bar-kod";
                btnKamera.style.background = "#007bff";
            });
        } else {
            readerDiv.style.display = "none";
            btnKamera.innerText = "📷 Upali kameru za Bar-kod";
            btnKamera.style.background = "#007bff";
        }
    }

    // Funkcija koja obavlja automatski upis prilikom kontinualnog skeniranja kamerom
    function dodajArtikalAutomatski(sifraKoda) {
        let sifra = sifraKoda.trim();
        let kolicina = parseInt(document.getElementById("kolicina").value) || 1;

        let postojeci = artikli.find(a => a.sifra === sifra);
        if (postojeci) {
            postojeci.kolicina += kolicina;
        } else {
            artikli.push({ sifra: sifra, kolicina: kolicina });
        }

        localStorage.setItem("inventura_artikli", JSON.stringify(artikli));
        prikaziArtikale();

        document.getElementById("sifra").value = "";
        document.getElementById("kolicina").value = "1";

        // Efekat zelenog bljeska na ekranu kao potvrda da je artikal upisan
        const unosBox = document.getElementById("unosBox");
        unosBox.classList.remove("flash-success");
        void unosBox.offsetWidth; // Restart CSS animacije
        unosBox.classList.add("flash-success");
    }

    // Standardna funkcija za ručni upis preko dugmeta "Upiši Artikal"
    function dodajArtikal(e) {
        // POPRAVLJENO: Sprečavamo da dugme osvježi/refreshuje stranicu i ugasi kameru
        if (e) {
            e.preventDefault();
        }

        let sifra = document.getElementById("sifra").value.trim();
        let kolicina = parseInt(document.getElementById("kolicina").value);

        // Ako je polje prazno, a kamera radi, ne radimo ništa jer kamera sama obavlja upis u pozadini
        if (!sifra && html5Qrcode && html5Qrcode.isScanning) {
            return;
        }

        if (!sifra || kolicina < 1) {
            alert("Molimo unesite ispravnu šifru i količinu!");
            return;
        }

        let postojeci = artikli.find(a => a.sifra === sifra);
        if (postojeci) {
            postojeci.kolicina += kolicina;
        } else {
            artikli.push({ sifra: sifra, kolicina: kolicina });
        }

        localStorage.setItem("inventura_artikli", JSON.stringify(artikli));
        prikaziArtikale();

        document.getElementById("sifra").value = "";
        document.getElementById("kolicina").value = "1";
        zadnjiSkeniraniKod = ""; // Dozvoli ponovno skeniranje istog koda
    }

    function prikaziArtikale() {
        let tbody = document.getElementById("tabelaArtikala");
        tbody.innerHTML = "";
        let obrnutiArtikli = [...artikli].reverse();
        obrnutiArtikli.forEach(artikal => {
            let row = `<tr><td>${artikal.sifra}</td><td>${artikal.kolicina}</td></tr>`;
            tbody.innerHTML += row;
        });
    }

    function preuzmiCSV() {
        if (artikli.length === 0) {
            alert("Nema podataka za preuzimanje!");
            return;
        }
        
        let csvContent = "";
        artikli.forEach(a => {
            csvContent += `${a.sifra},${a.kolicina}\n`;
        });

        let blob = new Blob([csvContent], { type: "text/plain;charset=utf-8;" });
        let link = document.createElement("a");
        let url = URL.createObjectURL(blob);
        
        link.setAttribute("href", url);
        link.setAttribute("download", "inventura.txt");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function obrisiSve() {
        if (confirm("Da li ste sigurni da želite obrisati sve skenirane artikle sa telefona?")) {
            localStorage.removeItem("inventura_artikli");
            artikli = [];
            prikaziArtikale();
            zadnjiSkeniraniKod = "";
        }
    }
</script>

</body>
</html>
